<div class="login-page">

  <main class="login-card">

    <img src="gallery/logo.png" alt="தமிழ்நாடு மாநில கூட்டுறவு சங்கங்களின் தேர்தல் ஆணையம் சின்னம்" class="logo">

    <h1 class="org-name">
      தமிழ்நாடு மாநில கூட்டுறவு சங்கங்களின்
      <span>தேர்தல் ஆணையம்</span>
    </h1>

    <!-- (ngSubmit) so the Enter key logs in too -->
    <form class="login-form" (ngSubmit)="login()" autocomplete="on">

      <!-- Username -->
      <label class="field-label" for="login-username">பயனர் பெயர் (Username)</label>
      <div class="field">
        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2.25c-3.75 0-7.5 1.9-7.5 4.5V21h15v-2.25c0-2.6-3.75-4.5-7.5-4.5Z"/>
        </svg>
        <input id="login-username" type="text" [(ngModel)]="username" name="username"
          autocomplete="username" placeholder="Username" required
          (input)="errorMessage = ''">
      </div>

      <!-- Password -->
      <label class="field-label" for="login-password">கடவுச்சொல் (Password)</label>
      <div class="field">
        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 9V7A5 5 0 0 0 7 7v2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2ZM9 7a3 3 0 0 1 6 0v2H9V7Zm3 10a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/>
        </svg>
        <input id="login-password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password"
          name="password" autocomplete="current-password" placeholder="Password" required
          (keyup)="checkCapsLock($event)" (keydown)="checkCapsLock($event)" (blur)="capsLockOn = false"
          (input)="errorMessage = ''">

        <button type="button" class="eye-btn" (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword">
          <!-- eye -->
          <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5C6.5 5 2.7 9.1 1.5 12c1.2 2.9 5 7 10.5 7s9.3-4.1 10.5-7C21.3 9.1 17.5 5 12 5Zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Zm0-2.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
          </svg>
          <!-- eye crossed -->
          <svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.3 2.3 2 3.6l3.1 3.1C3.5 8 2.2 9.9 1.5 12c1.2 2.9 5 7 10.5 7 2 0 3.8-.5 5.3-1.4l3.1 3.1 1.3-1.3L3.3 2.3ZM12 16.5a4.5 4.5 0 0 1-4.3-5.8l1.6 1.6a2 2 0 0 0 2.4 2.4l1.6 1.6c-.4.1-.8.2-1.3.2Zm0-11.5c5.5 0 9.3 4.1 10.5 7-.5 1.3-1.4 2.7-2.6 3.9l-3.5-3.5A4.5 4.5 0 0 0 11.6 7.4L9 4.8C9.9 5 10.9 5 12 5Z"/>
          </svg>
        </button>
      </div>

      <!-- Caps Lock warning -->
      <p class="caps-warning" *ngIf="capsLockOn" role="status">Caps Lock இயக்கத்தில் உள்ளது</p>

      <!-- Error -->
      <p class="error-text" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

      <!-- Login -->
      <button type="submit" class="login-btn" [disabled]="loading">
        <span class="spinner" *ngIf="loading" aria-hidden="true"></span>
        {{ loading ? 'உள்நுழைகிறது…' : 'உள்நுழை (Login)' }}
      </button>

    </form>

    <p class="footer">© 2025–2026 · தமிழ்நாடு மாநில கூட்டுறவு சங்கங்களின் தேர்தல் ஆணையம்</p>
  </main>

  <!-- Success toast -->
  <div class="toast-success" *ngIf="showToast" role="status">
    உள்நுழைவு வெற்றிகரமாக முடிந்தது
  </div>

</div>
