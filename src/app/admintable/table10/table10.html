<div class="table-actions">

    <div class="filter-section">

        <div class="filter-item">
            <label>Department:</label>

            <select [(ngModel)]="selectedDepartment" (change)="applyFilter()">

                <option value="">All</option>

                <option *ngFor="let d of departmentList" [value]="d.name">

                    {{d.name}}

                </option>

            </select>
        </div>

        <div class="filter-item">
            <label>District:</label>

            <select [(ngModel)]="selectedDistrict" (change)="applyFilter()">

                <option value="">All</option>

                <option *ngFor="let d of districtList" [value]="d.name">

                    {{d.name}}

                </option>

            </select>
        </div>

    </div>

    <div class="action-group">
        <button class="export-btn view-toggle-btn" (click)="toggleViewMode()">
            {{ viewMode === 'full' ? '📊 சுருக்க அட்டவணை (Abstract)' : '📋 முழு அட்டவணை (Full List)' }}
        </button>

        <button class="export-btn" (click)="downloadPdf()">

            📄 {{ viewMode === 'abstract' ? 'Download Abstract PDF' : 'Download PDF' }}

        </button>
    </div>

</div>

<!-- FORM HEADING (above the table) -->
<h2 class="form-heading">{{ formNumber }} ({{ part }})</h2>
<div class="table-source">அட்டவணை {{ formNumber.replace('படிவம்', '').trim() }} ({{ part }}) (பதிவு படிவம் {{ formNumber.replace('படிவம்', '').trim() }} ({{ part }})-லிருந்து)</div>

<app-abstract-table *ngIf="viewMode === 'abstract'"
    [formNumber]="formNumber + ' (' + part + ')'" [title]="title" [department]="selectedDepartment || department_name || 'அனைத்தும்'"
    [groups]="abstract.groups" [rows]="abstract.zones">
</app-abstract-table>

<div class="table-scroll-wrapper" *ngIf="viewMode === 'full'">
    <app-form14-table office="vice_president" [part]="part" [forms]="forms" [departmentName]="selectedDepartment || department_name || 'அனைத்தும்'"></app-form14-table>
</div>
