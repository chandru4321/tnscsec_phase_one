<div class="forms-container">
  <div class="forms-inner">

    <div class="election-programme-bar">
      <a [routerLink]="['/layout/electionschedule']">
        தேர்தல் அட்டவணை (Election Schedule)
      </a>
      <!-- <a [routerLink]="['/layout/electionprogramme']">
      தேர்தல் திட்ட அறிவிப்பு (Election Programme)
    </a> -->
    </div>

    <table class="forms-table">

      <tr *ngFor="let f of formsList">

        <td class="title">{{ f.title }}</td>

        <!-- View = TABLE -->
        <td>
          <button class="view-btn" [routerLink]="f.tableLink">
            View
          </button>
        </td>


        <!-- Form link -->
        <td class="link">

          <!-- Form1 ALWAYS clickable -->
          <a *ngIf="f.code === 'Form1'" [routerLink]="f.formLink">
            ({{ f.code }})
            <span class="arrow">➜</span>

          </a>

          <!-- Form2 clickable ONLY after Form1 completed
        <a *ngIf="f.code === 'Form2' && isForm1Completed()" [routerLink]="f.formLink">
          ({{ f.code }})
        </a> --->
          <a *ngIf="f.code === 'Form2' " [routerLink]="f.formLink">

            ({{ f.code }})
            <span class="arrow">➜</span>

          </a>
          <!---
         <span
          *ngIf="f.code === 'Form2' && !isForm1Completed()"
          class="disabled-text">
          ({{ f.code }})
        </span> -->
          <!-- <span *ngIf="f.code === 'Form2' ">
          ({{ f.code }})
        </span> -->

          <!-- 🔥 Form3 clickable ONLY after Form2 completed-->
          <a *ngIf="f.code === 'Form3' " [routerLink]="f.formLink">
            ({{ f.code }})
            <span class="arrow">➜</span>

          </a>

          <a *ngIf="f.code === 'Form4' " [routerLink]="f.formLink">
            ({{ f.code }})
            <span class="arrow">➜</span>

          </a>

          <a *ngIf="f.code === 'Form5' " [routerLink]="f.formLink">
            ({{ f.code }})
            <span class="arrow">➜</span>

          </a>
          <a *ngIf="f.code === 'Form5b' " [routerLink]="f.formLink">
            ({{ f.label }})
            <span class="arrow">➜</span>

          </a>
          <a *ngIf="f.code === 'Form6' " [routerLink]="f.formLink">
            ({{ f.label }})
            <span class="arrow">➜</span>

          </a>
          <span *ngIf="f.code === 'Form6List' || f.code === 'Form8Names' || f.code === 'Form8Counts' || f.code === 'Form8Incomplete' || f.code === 'Form8Office'" class="no-submission">No Submission</span>
          <a *ngIf="f.code === 'Form7' " [routerLink]="f.formLink">
            ({{ f.label }})
            <span class="arrow">➜</span>

          </a>
          <a *ngIf="f.code === 'Form8' " [routerLink]="f.formLink">
            ({{ f.label }})
            <span class="arrow">➜</span>

          </a>
          <a *ngIf="f.code === 'Form9' || f.code === 'Form9b'" [routerLink]="f.formLink">
            ({{ f.label }})
            <span class="arrow">➜</span>

          </a>
          <a *ngIf="f.code === 'Form10' || f.code === 'Form10b'" [routerLink]="f.formLink">
            ({{ f.label }})
            <span class="arrow">➜</span>

          </a>

          <!-- 🔒 Form3 locked -->
          <!-- <span
          *ngIf="f.code === 'Form3' && !isForm2Completed()"
          class="disabled-text">
          ({{ f.code }})
        </span> -->
          <!-- <span *ngIf="f.code === 'Form3' ">
          ({{ f.code }})
        </span> -->

        </td>

      </tr>

    </table>

  </div>
</div>
